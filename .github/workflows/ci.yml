name: CI

# Formatting, clippy and the tests run on every push and pull request, on
# Windows, macOS and Linux. The APK and the Unraid plugin are built when
# started by hand (Actions → CI → Run workflow); releases are built locally
# by scripts/release.sh (see "Releases" in the README).
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  unraid:
    name: Unraid plugin
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl and PHP
        run: sudo apt-get update && sudo apt-get install -y musl-tools php-cli
      - name: Check the page's PHP and script
        run: |
          for f in unraid/plugin/root/usr/local/emhttp/plugins/freesize/include/*.php; do php -l "$f"; done
          node --check unraid/plugin/root/usr/local/emhttp/plugins/freesize/freesize.js
          bash -n unraid/plugin/root/etc/rc.d/rc.freesize
      - name: Test the page's PHP as Unraid runs it
        run: php unraid/tests/page_test.php
      - name: Build the plugin
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p freesize-cli
          scripts/unraid-plugin.sh target/x86_64-unknown-linux-musl/release/freesize dist
      - uses: actions/upload-artifact@v4
        with:
          name: freesize-unraid
          path: dist/

  android:
    name: Android APK
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK platform and cargo-apk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null
          cargo install cargo-apk --locked
      - name: Build and check APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          scripts/android/build-apk.sh dist/freesize-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: freesize-android
          path: dist/freesize-android.apk
