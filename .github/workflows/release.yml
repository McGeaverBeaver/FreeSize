name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Build
        run: cargo build --release -p disktree-app -p disktree-cli
      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/disktree-gui.exe target/release/disktree.exe dist/
            (cd dist && 7z a "../disktree-${{ matrix.name }}.zip" .)
          else
            cp target/release/disktree-gui target/release/disktree dist/
            tar -czf "disktree-${{ matrix.name }}.tar.gz" -C dist .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: disktree-${{ matrix.name }}
          path: disktree-${{ matrix.name }}.*

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a throwaway key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias release -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=DiskTree"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          fi
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          mkdir dist
          for target in aarch64-linux-android x86_64-linux-android; do
            cargo apk build -p disktree-app --lib --release --target "$target"
            cp target/release/apk/DiskTree.apk "dist/disktree-android-${target%%-*}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: disktree-android
          path: dist/*.apk

  publish:
    name: Publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: disktree-*
          generate_release_notes: true
