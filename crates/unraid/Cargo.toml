[package]
name = "freesize-unraid"
description = "What FreeSize knows about Unraid: the array, shares, Docker, VMs, quarantine and moves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
freesize-agent.workspace = true
freesize-core.workspace = true
freesize-proto.workspace = true
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
