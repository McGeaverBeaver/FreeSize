[package]
name = "freesize-agent"
description = "The device side of the FreeSize Hub: pairing, reports, commands and approvals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
# An HTTP client for desktops and servers. Android brings its own (Java's).
ureq = ["dep:ureq"]
# Unpacking a downloaded release (desktops; Android installs the APK).
install = ["dep:flate2", "dep:tar", "dep:zip"]
# Looking for words inside text, Office and PDF files (folder review).
review = ["dep:zip", "dep:pdf-extract"]

[dependencies]
base64 = "0.23.1"
flate2 = { version = "1.1.10", optional = true }
freesize-core.workspace = true
freesize-proto.workspace = true
# Pure Rust, so it builds for Android and Windows without a C compiler.
pdf-extract = { version = "0.12.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", optional = true }
zip = { version = "9.0.2", default-features = false, features = ["deflate"], optional = true }

# The system's TLS and certificate store on Windows and macOS, so nothing
# needs a C compiler there; rustls with the system's certificates elsewhere.
# ("native-tls", not "native-tls-no-default": with only the latter, ureq
# panics on every https address, the Hub's included.)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3.4.2", optional = true, default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3.4.2", optional = true, default-features = false, features = ["rustls", "platform-verifier"] }

# The Nextcloud client's placeholders on Windows (0.13): the pinned and
# unpinned attributes, like Explorer's "Free up space".
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
