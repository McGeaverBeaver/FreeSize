[package]
name = "freesize-hub"
description = "FreeSize Hub: one dashboard for all your devices' storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "freesize-hub"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
freesize-agent.workspace = true
freesize-core.workspace = true
freesize-proto.workspace = true
flate2 = "1.1.10"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
x509-parser = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio"] }
tower = { version = "0.5", features = ["util"] }
time = "0.3"

[dev-dependencies]
freesize-agent = { workspace = true, features = ["ureq"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
