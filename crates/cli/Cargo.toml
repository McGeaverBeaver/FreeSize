[package]
name = "freesize-cli"
description = "Command-line disk usage analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "freesize"
path = "src/main.rs"

[dependencies]
freesize-core.workspace = true
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.145"
freesize-agent = { workspace = true, features = ["ureq", "install"] }
freesize-proto.workspace = true
serde = { version = "1.0.228", features = ["derive"] }

# The Unraid plugin's commands; Unraid is Linux.
[target.'cfg(unix)'.dependencies]
freesize-unraid.workspace = true
