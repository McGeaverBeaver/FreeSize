[package]
name = "disktree-cli"
description = "Command-line disk usage analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "disktree"
path = "src/main.rs"

[dependencies]
disktree-core.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.145"
disktree-agent = { workspace = true, features = ["ureq"] }
disktree-proto.workspace = true
serde = { version = "1.0.228", features = ["derive"] }

# The Unraid plugin's commands; Unraid is Linux.
[target.'cfg(unix)'.dependencies]
disktree-unraid.workspace = true
