[package]
name = "disktree-app"
description = "DiskTree desktop and Android app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "disktree_app"
# cdylib is what Android loads; desktop builds use the binary below.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "disktree-gui"
path = "src/main.rs"

[dependencies]
disktree-core.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
slint = "1.18.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"
trash = "5.2.9"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
jni = "0.22.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.5.0"
plist = "1.10.1"

[build-dependencies]
slint-build = "1.18.1"

# Read by `cargo apk build`; build with scripts/android/build-apk.sh, which
# also applies the 16 KB page alignment flag and verifies the result.
[package.metadata.android]
package = "dev.disktree.app"
apk_name = "DiskTree"
# One universal APK: arm64-v8a for phones, x86_64 for emulators and Chromebooks.
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
# Android 16. Google Play requires API 36 for new apps and updates.
target_sdk_version = 36

[package.metadata.android.application]
label = "DiskTree"
icon = "@mipmap/ic_launcher"
theme = "@style/AppTheme"

[package.metadata.android.application.activity]
# Handle these changes in place: Slint relayouts on its own, and recreating a
# NativeActivity would restart the Rust side.
config_changes = "orientation|screenSize|smallestScreenSize|screenLayout|density|uiMode|fontScale|keyboard|keyboardHidden|navigation|locale|layoutDirection|colorMode|touchscreen"
launch_mode = "singleTask"

# Android 10 and older: classic storage permissions.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

# Android 11+: "All files access", needed to see all of shared storage.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# Lets StorageStatsManager report other apps' storage; the user turns it on
# under "Usage access".
[[package.metadata.android.uses_permission]]
name = "android.permission.PACKAGE_USAGE_STATS"

# Android 11+ only lists every installed app with this.
[[package.metadata.android.uses_permission]]
name = "android.permission.QUERY_ALL_PACKAGES"

# Lets the Uninstall button open Android's uninstall confirmation. Without it
# Android silently ignores the request.
[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_DELETE_PACKAGES"
