[package]
name = "freesize-app"
description = "FreeSize desktop and Android app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "freesize_app"
# cdylib is what Android loads; desktop builds use the binary below.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "freesize-gui"
path = "src/main.rs"

[dependencies]
freesize-agent.workspace = true
freesize-core.workspace = true
freesize-proto.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
slint = "1.18.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
# The Hub is reached with ureq on desktops; Android uses Java's HTTP client.
freesize-agent = { workspace = true, features = ["ureq", "install"] }
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
jni = "0.22.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.5.0"
plist = "1.10.1"

[build-dependencies]
slint-build = "1.18.1"

# Read by `cargo apk build`; build with scripts/android/build-apk.sh, which
# also applies the 16 KB page alignment flag and verifies the result.
[package.metadata.android]
package = "io.github.mcgeaverbeaver.freesize"
apk_name = "FreeSize"
# One universal APK: arm64-v8a for phones, x86_64 for emulators and Chromebooks.
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
# Android 16. Google Play requires API 36 for new apps and updates.
target_sdk_version = 36

[package.metadata.android.application]
label = "FreeSize"
icon = "@mipmap/ic_launcher"
theme = "@style/AppTheme"
# Lets the app reach a Hub at a plain http address, the usual LAN setup;
# Android refuses plain http otherwise, for apps targeting Android 9 and
# later. The app warns when the Hub's address is plain http. Android ignores
# this attribute for apps targeting API 38 and later, which then need a
# network security config instead.
uses_cleartext_traffic = true

[package.metadata.android.application.activity]
# Handle these changes in place: Slint relayouts on its own, and recreating a
# NativeActivity would restart the Rust side.
config_changes = "orientation|screenSize|smallestScreenSize|screenLayout|density|uiMode|fontScale|keyboard|keyboardHidden|navigation|locale|layoutDirection|colorMode|touchscreen"
launch_mode = "singleTask"

# Opens pairing links (freesize://pair?...) from a scanned QR code, and
# disktree://pair?... from a Hub not updated since the rename. cargo-apk
# still adds the launcher entry, since this filter has no MAIN action.
# The APK that's shipped uses crates/app/android/AndroidManifest.xml, where
# since 0.15.1 this filter is on the PairLink activity instead, so a link
# reaches the app when it's already running too.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [{ scheme = "freesize", host = "pair" }, { scheme = "disktree", host = "pair" }]

# Android 10 and older: classic storage permissions.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

# Android 11+: "All files access", needed to see all of shared storage.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# Lets StorageStatsManager report other apps' storage; the user turns it on
# under "Usage access".
[[package.metadata.android.uses_permission]]
name = "android.permission.PACKAGE_USAGE_STATS"

# Android 11+ only lists every installed app with this.
[[package.metadata.android.uses_permission]]
name = "android.permission.QUERY_ALL_PACKAGES"

# Talking to a FreeSize Hub, when one is connected.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Lets the Uninstall button open Android's uninstall confirmation. Without it
# Android silently ignores the request.
[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_DELETE_PACKAGES"

# Lets Update hand a verified release to Android's installer, which asks
# (and, the first time, sends the person to allow it for FreeSize).
[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"
