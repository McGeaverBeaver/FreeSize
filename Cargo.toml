[workspace]
resolver = "3"
members = [
    "crates/core", "crates/proto", "crates/agent", "crates/unraid", "crates/cli", "crates/app", "crates/hub",
]
default-members = [
    "crates/core", "crates/proto", "crates/agent", "crates/unraid", "crates/cli", "crates/app", "crates/hub",
]

[workspace.package]
version = "0.15.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/McGeaverBeaver/FreeSize"
license = "GPL-3.0-or-later"

[workspace.dependencies]
freesize-core = { path = "crates/core" }
freesize-proto = { path = "crates/proto" }
freesize-agent = { path = "crates/agent" }
freesize-unraid = { path = "crates/unraid" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
