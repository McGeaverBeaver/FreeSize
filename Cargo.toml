[workspace]
resolver = "3"
members = ["crates/core", "crates/proto", "crates/cli", "crates/app", "crates/hub"]
default-members = ["crates/core", "crates/proto", "crates/cli", "crates/app", "crates/hub"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/McGeaverBeaver/TreeSizeCloneAndroid"

[workspace.dependencies]
disktree-core = { path = "crates/core" }
disktree-proto = { path = "crates/proto" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
