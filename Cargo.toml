[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]
default-members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/McGeaverBeaver/TreeSizeCloneAndroid"

[workspace.dependencies]
disktree-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
